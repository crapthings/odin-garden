name: Release-qualified integration

on:
  pull_request:
    paths:
      - '.github/workflows/release-qualified-integration.yml'
      - 'ecosystem.toml'
      - 'fixtures/**'
      - 'integration/**'
      - 'queries/**'
      - 'scripts/verify-rdfs-sparql.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-qualified-integration.yml'
      - 'ecosystem.toml'
      - 'fixtures/**'
      - 'integration/**'
      - 'queries/**'
      - 'scripts/verify-rdfs-sparql.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdfs-sparql:
    name: RDFS closure to SPARQL views
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-rdf
          ref: d07162c20355f40cd05f031798b808a54c06fb25 # v0.32.1
          path: _deps/odin-rdf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-reasoner
          ref: 476fe5917181776368b21f26622e0f79d7f22a4f # v0.6.0
          path: _deps/odin-reasoner
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-sparql
          ref: d8503a652539497f2f6622cee04c899ef3bfeb0f # v0.2.0
          path: _deps/odin-sparql
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-graph
          ref: 8c349129a75551335bb10685ead4709951155406 # v0.1.0
          path: _deps/odin-graph
          fetch-depth: 0
          persist-credentials: false
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07
      - name: Recreate the documented adjacent-checkout layout
        run: |
          ln -s "$GITHUB_WORKSPACE/_deps/odin-rdf" "$GITHUB_WORKSPACE/../odin-rdf"
          ln -s "$GITHUB_WORKSPACE/_deps/odin-reasoner" "$GITHUB_WORKSPACE/../odin-reasoner"
          ln -s "$GITHUB_WORKSPACE/_deps/odin-sparql" "$GITHUB_WORKSPACE/../odin-sparql"
          ln -s "$GITHUB_WORKSPACE/_deps/odin-graph" "$GITHUB_WORKSPACE/../odin-graph"
      - name: Verify the pinned RDFS-to-SPARQL integration path
        run: sh scripts/verify-rdfs-sparql.sh
