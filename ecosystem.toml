# Odin Garden integration baseline.
#
# This records an immutable tag-qualified component baseline. Passing this
# gate proves the documented RDFS Core default-graph path only; it does not by
# itself establish a supported public release or the shared mutable graph
# semantics required for extraction.

[baseline]
name = "rdfs-sparql-first-closure"
kind = "release-qualified"
recorded_on = "2026-07-26"

[toolchain]
command = "odin"
version = "dev-2026-07-nightly:ab0131c"

[components.odin_rdf]
repository = "https://github.com/crapthings/odin-rdf.git"
revision = "d07162c20355f40cd05f031798b808a54c06fb25"
release = "v0.32.1"
release_qualified = true

[components.odin_reasoner]
repository = "https://github.com/crapthings/odin-reasoner.git"
revision = "476fe5917181776368b21f26622e0f79d7f22a4f"
release = "v0.6.0"
release_qualified = true

[components.odin_sparql]
repository = "https://github.com/crapthings/odin-sparql.git"
revision = "d8503a652539497f2f6622cee04c899ef3bfeb0f"
release = "v0.2.0"
release_qualified = true

[components.odin_graph]
repository = "https://github.com/crapthings/odin-graph.git"
revision = "8c349129a75551335bb10685ead4709951155406"
release = "v0.1.0"
release_qualified = true
purpose = "experimental tagged graph baseline plus optional SPARQL and Reasoner migration adapters; not an independently supported public release"

[commands.rdfs_sparql_first_closure]
description = "Run the pinned release-qualified RDFS closure to SPARQL integration fixture."
command = "sh scripts/verify-rdfs-sparql.sh"
requires_adjacent_checkouts = ["../odin-rdf", "../odin-reasoner", "../odin-sparql", "../odin-graph"]
status = "release-qualified local integration evidence"

[validation_baselines.shacl_core_person_record]
name = "shacl-core-person-record"
kind = "release-qualified"
recorded_on = "2026-07-26"
description = "Bounded SHACL Core validation with a deterministic owned report; independent from the RDFS-to-SPARQL baseline."

[validation_baselines.shacl_core_person_record.toolchain]
command = "odin"
version = "dev-2026-07-nightly:ab0131c"

[validation_baselines.shacl_core_person_record.components.odin_rdf]
repository = "https://github.com/crapthings/odin-rdf.git"
revision = "eac24a8d3251d03cb3fe700e6ffbda0ad1a47ee4"
release = "v0.33.0"
release_qualified = true

[validation_baselines.shacl_core_person_record.components.odin_shacl]
repository = "https://github.com/crapthings/odin-shacl.git"
revision = "4ee8249b84380e4ef1d888bd94f8cd24d6e7b985"
release = "v0.1.0"
release_qualified = true

[commands.shacl_core_person_record]
description = "Run the pinned SHACL Core person-record validation fixture."
command = "sh scripts/verify-shacl.sh"
requires_adjacent_checkouts = ["../odin-rdf", "../odin-shacl"]
status = "release-qualified local integration evidence"
