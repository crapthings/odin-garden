name: Development graph convergence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/development-graph-convergence.yml'
      - 'integration/graph_convergence/**'
      - 'integration/rdfs_sparql/**'
  pull_request:
    paths:
      - '.github/workflows/development-graph-convergence.yml'
      - 'integration/graph_convergence/**'
      - 'integration/rdfs_sparql/**'

permissions:
  contents: read

jobs:
  reasoner-origin:
    name: RDFS closure origin preservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-rdf
          ref: 4ddd470c04e0a688807509275eeeece5db02fb87 # OWL RL literal value relation dispatch
          path: _deps/odin-rdf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-reasoner
          ref: 70e0ee6a517241fc126bc2f3e81ff6566797e7ce # generalized OWL datatype contradictions
          path: _deps/odin-reasoner
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-sparql
          ref: 285a98498f5885021fa321bfb8729560535174d0 # development convergence baseline
          path: _deps/odin-sparql
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-graph
          ref: 446cd3d002d7c4b27ff5224d0e987b88a0f96f00 # development derivation metadata
          path: _deps/odin-graph
          fetch-depth: 0
          persist-credentials: false
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07
      - name: Recreate the documented adjacent-checkout layout
        run: |
          ln -s "$GITHUB_WORKSPACE/_deps/odin-rdf" "$GITHUB_WORKSPACE/../odin-rdf"
          ln -s "$GITHUB_WORKSPACE/_deps/odin-reasoner" "$GITHUB_WORKSPACE/../odin-reasoner"
          ln -s "$GITHUB_WORKSPACE/_deps/odin-sparql" "$GITHUB_WORKSPACE/../odin-sparql"
          ln -s "$GITHUB_WORKSPACE/_deps/odin-graph" "$GITHUB_WORKSPACE/../odin-graph"
      - name: Verify current RDFS-to-SPARQL integration
        run: odin test integration/rdfs_sparql -collection:odin-rdf="$GITHUB_WORKSPACE/_deps/odin-rdf" -collection:odin-reasoner="$GITHUB_WORKSPACE/_deps/odin-reasoner" -collection:odin-sparql="$GITHUB_WORKSPACE/_deps/odin-sparql" -collection:odin-graph="$GITHUB_WORKSPACE/_deps/odin-graph"
      - name: Verify RDFS closure asserted/inferred origin preservation
        run: odin test integration/graph_convergence -collection:odin-rdf="$GITHUB_WORKSPACE/_deps/odin-rdf" -collection:odin-reasoner="$GITHUB_WORKSPACE/_deps/odin-reasoner" -collection:odin-graph="$GITHUB_WORKSPACE/_deps/odin-graph"
